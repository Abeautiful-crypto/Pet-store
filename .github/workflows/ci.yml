name: CI

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Unit + race tests
        run: go test -race ./...

      - name: Build linux binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o petstore-server ./cmd/server
